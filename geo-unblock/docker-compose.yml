services:
  vpn:
    image: qmcgaw/gluetun:v3
    container_name: tv-geo-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?configure in .env}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?configure in .env}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY:?configure in .env}
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:?configure in .env}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-51820}
      FIREWALL_INPUT_PORTS: "8080"
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    restart: unless-stopped

  hls-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tv-geo-hls-proxy
    network_mode: "service:vpn"
    depends_on:
      - vpn
    environment:
      PLAYLIST_PATH: /data/Tv.m3u
      PORT: "8080"
      PROXY_SIGNING_KEY: ${PROXY_SIGNING_KEY:?configure a long random key in .env}
    volumes:
      - ../Tv.m3u:/data/Tv.m3u:ro
    restart: unless-stopped
