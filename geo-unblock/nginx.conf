server {
    listen 8080;
    server_name _;

    # Verificação de saúde do gateway.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Publica a playlist integral da TV principal, montada diretamente
    # do arquivo Tv.m3u do repositório. Não há canais individuais fixos.
    location = /tv-principal.m3u {
        alias /usr/share/nginx/html/tv-principal.m3u;
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        return 404;
    }
}
