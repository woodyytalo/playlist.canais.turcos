server {
    listen 8080;
    server_name _;

    # Endpoints restritos aos hosts dos canais configurados abaixo.
    # O proxy não aceita URLs arbitrárias e não funciona como proxy aberto.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /gzt/ {
        proxy_pass https://gzttv-live.lg.mncdn.com/gzttv-live/gzttv/;
        proxy_ssl_server_name on;
        proxy_set_header Host gzttv-live.lg.mncdn.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /power-tv/ {
        proxy_pass https://live.artidijitalmedya.com/artidijital_powertv/powertv/;
        proxy_ssl_server_name on;
        proxy_set_header Host live.artidijitalmedya.com;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /4u-family/ {
        proxy_pass https://familyhls.4utv.live/hls/;
        proxy_ssl_server_name on;
        proxy_set_header Host familyhls.4utv.live;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /bein-sports-1-turk/ {
        proxy_pass http://57.129.0.61:1990/stream/117/;
        proxy_set_header Host 57.129.0.61;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
