name: Criar logos tipográficas 256x256 da TV principal

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/criar-logos-tipograficas.yml"

permissions:
  contents: write

jobs:
  criar-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Pillow
        run: python -m pip install --quiet pillow

      - name: Criar PNGs tipográficos e atualizar referências
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import re, unicodedata

          playlist = Path("Tv.m3u")
          lines = playlist.read_text(encoding="utf-8").splitlines()
          branch = "github/workflows/atualizar-logos.yml"
          base = f"https://raw.githubusercontent.com/woodyytalo/playlist.canais.turcos/{branch}/"

          def slug(s):
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", "-", s).strip("-") or "canal"

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          changed, missing = [], []
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              name = line.rsplit(",", 1)[-1].strip()
              key = unicodedata.normalize("NFKD", name).casefold()
              key = re.sub(r"\s+", " ", key).strip()
              # Match diacritics-insensitively while retaining the original display name.
              key_plain = "".join(c for c in unicodedata.normalize("NFKD", key) if not unicodedata.combining(c))
              if key_plain not in {"play tv", "now 70 s", "now 80 s", "now rock"}:
                  continue

              group = re.search(r'group-title="([^"]+)"', line)
              category_name = group.group(1) if group else ""
              category_plain = "".join(c for c in unicodedata.normalize("NFKD", category_name.casefold()) if not unicodedata.combining(c))
              if category_plain != "musica":
                  continue
              category = slug(group.group(1) if group else "sem-categoria")
              folder = Path("logos-ajustadas") / category
              folder.mkdir(parents=True, exist_ok=True)
              filename = slug(name) + ".png"
              target = folder / filename

              image = Image.new("RGB", (256, 256), (0, 0, 0))
              draw = ImageDraw.Draw(image)
              max_width, max_height = 224, 150
              size = 52
              while size > 16:
                  font = ImageFont.truetype(font_path, size)
                  box = draw.multiline_textbbox((0, 0), name, font=font, align="center", spacing=5, stroke_width=0)
                  if box[2] - box[0] <= max_width and box[3] - box[1] <= max_height:
                      break
                  size -= 2
              box = draw.multiline_textbbox((0, 0), name, font=font, align="center", spacing=5)
              w, h = box[2] - box[0], box[3] - box[1]
              x, y = (256 - w) / 2 - box[0], (256 - h) / 2 - box[1]
              draw.multiline_text((x, y), name, font=font, fill=(255, 255, 255), align="center", spacing=5)
              image.save(target, format="PNG", optimize=True)

              url = base + str(target).replace("\\", "/")
              if re.search(r'\s+tvg-logo="[^"]*"', line):
                  line = re.sub(r'\s+tvg-logo="[^"]*"', f' tvg-logo="{url}"', line, count=1)
              else:
                  comma = line.rfind(",")
                  line = line[:comma] + f' tvg-logo="{url}"' + line[comma:]
              lines[i] = line
              changed.append(name)

          playlist.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("LOGOS TIPOGRÁFICAS CRIADAS:", len(changed))
          for name in changed:
              print("CRIADA:", name)
          print("DIMENSÃO: 256x256; PROPORÇÃO: 1:1; FUNDO: PRETO; TEXTO: NOME DO CANAL")
          PY

      - name: Publicar alterações
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tv.m3u logos-ajustadas/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Criar logos tipográficas 256x256 para canais sem marca"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
