name: Baixar IPTV Cat Turquia para o backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  baixar-lista-turquia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: "github/workflows/atualizar-logos.yml"
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência HTTP
        run: python -m pip install requests
      - name: Baixar e mesclar listas da Turquia
        run: python scripts/baixar_iptvcat_turquia.py
      - name: Salvar backup e relatório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backup.m3u relatorios/iptvcat-turquia-download.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para salvar."
          else
            git commit -m "Atualiza backup com listas IPTV Cat Turquia"
            git push
          fi
