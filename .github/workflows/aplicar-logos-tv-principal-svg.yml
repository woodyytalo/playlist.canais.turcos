name: Aplicar logos quadradas SVG na TV principal
on:
  push:
    branches:
      - github/workflows/atualizar-logos.yml
    paths:
      - .github/workflows/tv-principal-svg.trigger
permissions:
  contents: write
jobs:
  apply-tv-logos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests vtracer beautifulsoup4
      - name: Coletar imagens dos canais disponíveis no CanliTV
        run: python scripts/coletar_logos_canlitv.py
      - name: Preparar e aplicar logos quadradas SVG
        run: python scripts/preparar_logos_tv_principal_svg.py
      - name: Montar arquivo ZIP com todas as logos SVG da TV principal
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          source = Path("logos-turcas-catalogo/tv-principal-svg")
          files = sorted(source.glob("*.svg"))
          if not files:
              raise SystemExit("Nenhuma logo SVG encontrada; ZIP não será criado.")
          output = Path("logos-tv-principal-canlitv.zip")
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for file in files:
                  archive.write(file, arcname=file.name)
          print(f"ZIP criado com {len(files)} logos SVG.")
          PY
      - name: Publicar arquivo ZIP como artefato
        uses: actions/upload-artifact@v4
        with:
          name: logos-tv-principal-canlitv
          path: logos-tv-principal-canlitv.zip
          if-no-files-found: error
          retention-days: 30
      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tv.m3u logos-turcas-catalogo/CATALOGO-UNIFICADO.md logos-turcas-catalogo/tv-principal-svg logos-turcas-catalogo/canlitv-images-report.csv
          if git diff --cached --quiet; then
            echo "TV principal já está atualizada; nenhuma alteração nova."
          else
            git commit -m "Aplicar logos SVG na TV principal"
            git push
          fi
