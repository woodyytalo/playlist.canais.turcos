name: Ajustar logos preservando formato original

on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "scripts/ajustar_logos_preservando_formato.py"
      - ".github/workflows/ajustar-logos.yml"

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install Pillow
      - name: Ajustar logos sem alterar proporção
        run: python scripts/ajustar_logos_preservando_formato.py
      - name: Salvar logos ajustadas
        run: |
          if [[ -n "$(git status --porcelain logos-ajustadas)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add logos-ajustadas/*.png
            git commit -m "Ajustar logos preservando proporção original"
            git push
          else
            echo "Nenhuma logo precisou de ajuste."
          fi
