name: Atualizar EPG IA

on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/atualizar-epg.yml"
      - "Tv.m3u8"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  atualizar-epg-ia:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Baixar e validar somente o XML do EPG.PW
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          url = 'https://epg.pw/xmltv/epg_lite.xml'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 PlaylistTurquiaEPG'})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read()
          root = ET.fromstring(data)
          if root.tag != 'tv':
              raise SystemExit('O arquivo recebido não é XMLTV.')
          channels = len(root.findall('channel'))
          programmes = len(root.findall('programme'))
          if not channels or not programmes:
              raise SystemExit('XMLTV sem canais ou sem programação; arquivo anterior preservado.')
          Path('epg').mkdir(exist_ok=True)
          Path('epg/epg-pw.xml').write_bytes(data)
          print(f'EPG.PW salvo: {channels} canais, {programmes} programas, {len(data)} bytes.')
          PY

      - name: Publicar somente o XML gerado pelo EPG.PW
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/epg-pw.xml
          if git diff --cached --quiet; then
            echo 'XML do EPG.PW sem alterações.'
          else
            git commit -m 'Atualiza XMLTV gerado pelo EPG.PW'
            git push
          fi
