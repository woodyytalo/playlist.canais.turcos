name: Atualizar tele guia próprio

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "scripts/sincronizar_epg.py"
      - "epg/cyberwire-sources.txt"
      - ".github/workflows/atualizar-epg.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sincronizar-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Preparar Node.js para Cyber-Wire
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Baixar e executar somente coletores Cyber-Wire
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Cyber-Wire/xmltv.git cyberwire
          cd cyberwire
          npm ci --ignore-scripts
          while IFS= read -r site; do
            [[ -z "$site" || "$site" =~ ^# ]] && continue
            output="../epg-cyberwire-${site//./-}.xml"
            echo "Coletando programação Cyber-Wire: $site"
            npm run grab -- --site="$site" --output="$output" --days=7 --maxConnections=2 || {
              echo "::warning::Coleta Cyber-Wire falhou para $site."
              rm -f "$output"
            }
          done < ../epg/cyberwire-sources.txt

      - name: Validar coleta Cyber-Wire e sincronizar todos os canais
        shell: bash
        run: |
          set -euo pipefail
          INPUTS=()
          for file in epg-cyberwire-*.xml; do
            [[ -s "$file" ]] && INPUTS+=(--input "$file")
          done
          if [[ ${#INPUTS[@]} -eq 0 ]]; then
            echo "::error::Cyber-Wire não retornou nenhum XMLTV. O guia publicado anteriormente será preservado."
            exit 1
          fi
          python3 scripts/sincronizar_epg.py \
            --playlist Tv.m3u8 \
            "${INPUTS[@]}" \
            --output epg/guia-proprio.xml
          rm -f epg-cyberwire-*.xml

      - name: Publicar XMLTV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guia-proprio.xml
          if git diff --cached --quiet; then
            echo 'Tele guia Cyber-Wire sem alterações.'
          else
            git commit -m 'Atualiza tele guia exclusivamente com Cyber-Wire XMLTV'
            git push
          fi
