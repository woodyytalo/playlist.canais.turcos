          ids = set()
          missing = []
          for line in playlist.splitlines():
              if not line.startswith('#EXTINF:'):
                  continue
              id_match = re.search(r'tvg-id="([^"]+)"', line)
              name_match = re.search(r'tvg-name="([^"]+)"', line)
              display = line.split(',', 1)[1].strip() if ',' in line else ''
              display = re.sub(r'\\s*\\[480 SD\\]
