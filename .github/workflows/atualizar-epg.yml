name: Atualizar EPG Turquia e sincronizar canais

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "scripts/sincronizar_epg.py"
      - "epg/fontes-open-epg.txt"
      - ".github/workflows/atualizar-epg.yml"
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: sincronizar-epg-tv-principal
  cancel-in-progress: true

jobs:
  sincronizar-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar fontes XMLTV disponíveis
        env:
          EPGFULL_URL: ${{ secrets.EPGFULL_URL }}
        shell: bash
        run: |
          set -euo pipefail
          files=(/tmp/epg-principal.xml /tmp/open-turkey1.xml /tmp/open-turkey2.xml /tmp/open-turkey3.xml /tmp/open-turkey4.xml)
          curl --fail --location --retry 3 --retry-delay 5 "https://raw.githubusercontent.com/trology85/iptv-epg-turkey/main/epg/turksat_epg.xml" -o /tmp/epg-principal.xml
          curl --fail --location --retry 3 --retry-delay 5 "https://www.open-epg.com/files/turkey1.xml" -o /tmp/open-turkey1.xml
          curl --fail --location --retry 3 --retry-delay 5 "https://www.open-epg.com/files/turkey2.xml" -o /tmp/open-turkey2.xml
          curl --fail --location --retry 3 --retry-delay 5 "https://www.open-epg.com/files/turkey3.xml" -o /tmp/open-turkey3.xml
          curl --fail --location --retry 3 --retry-delay 5 "https://www.open-epg.com/files/turkey4.xml" -o /tmp/open-turkey4.xml

          # Fontes complementares são opcionais: uma indisponibilidade não cancela as fontes válidas.
          optional_xml() {
            local url="$1" output="$2"
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 2 "$url" -o "$output"; then
              if python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); assert r.tag=="tv" and r.findall("channel") and r.findall("programme")' "$output"; then
                files+=("$output")
                echo "Fonte adicional validada: $url"
              else
                echo "Fonte adicional ignorada (XMLTV inválido): $url"
                rm -f "$output"
              fi
            else
              echo "Fonte adicional indisponível; seguindo sem ela: $url"
              rm -f "$output"
            fi
          }
          optional_gzip_xml() {
            local url="$1" output="$2" gz="${2}.gz"
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 2 "$url" -o "$gz" && gzip -dc "$gz" > "$output"; then
              if python3 -c 'import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); assert r.tag=="tv" and r.findall("channel") and r.findall("programme")' "$output"; then
                files+=("$output")
                echo "Fonte gzip validada: $url"
              else
                echo "Fonte gzip ignorada (XMLTV inválido): $url"
                rm -f "$output"
              fi
            else
              echo "Fonte gzip indisponível; seguindo sem ela: $url"
              rm -f "$gz" "$output"
            fi
          }

          optional_gzip_xml "https://epgshare01.online/epgshare01/epg_ripper_TR1.xml.gz" /tmp/epgshare-tr1.xml
          optional_gzip_xml "https://epgshare01.online/epgshare01/epg_ripper_TR3.xml.gz" /tmp/epgshare-tr3.xml
          optional_xml "https://free-epg.de/api/epg/tr.xml" /tmp/free-epg-tr.xml
          optional_xml "https://iptv-epg.org/files/epg-tr.xml" /tmp/iptv-epg-tr.xml
          # EPGFull usa URL pessoal .xml.gz guardada como segredo do GitHub.
          if [[ -n "${EPGFULL_URL:-}" ]]; then
            optional_gzip_xml "$EPGFULL_URL" /tmp/epgfull-turquia.xml
          else
            echo "EPGFull aguardando o segredo EPGFULL_URL no GitHub."
          fi
          # EPGHost: só será arquivado se trouxer canais E programas XMLTV reais.
          optional_xml "https://raw.githubusercontent.com/ahmethascelik/epghost/main/xmltv.xml" /tmp/epghost-turkey.xml

          # IPTV-org/epg: guia geral e guias específicos de operadoras turcas
          optional_xml "https://iptv-org.github.io/epg/guides/tr.xml" /tmp/iptv-org-turquia.xml
          optional_xml "https://iptv-org.github.io/epg/guides/tr/tvplus.com.tr.epg.xml" /tmp/iptv-org-tvplus.xml
          optional_xml "https://iptv-org.github.io/epg/guides/tr/digiturk.com.tr.epg.xml" /tmp/iptv-org-digiturk.xml
          optional_xml "https://iptv-org.github.io/epg/guides/tr/dsmart.com.tr.epg.xml" /tmp/iptv-org-dsmart.xml
          optional_xml "https://iptv-org.github.io/epg/guides/tr/turksatkablo.com.tr.epg.xml" /tmp/iptv-org-turksat-kablo.xml

          # Outros XMLTV turcos mantidos em repositórios GitHub
          optional_xml "https://raw.githubusercontent.com/GhalebAldoboni/EPG-Guide/master/TurkishEPG.xml" /tmp/ghaleb-turkish.xml
          optional_xml "https://raw.githubusercontent.com/hayatiptv/iptv/master/tr-EPG-guide.xml" /tmp/hayatiptv-turkey.xml
          optional_gzip_xml "https://teleonline.github.io/epg/epg.xml.gz" /tmp/teleonline-global.xml

          python3 - "${files[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              channels, programmes = root.findall("channel"), root.findall("programme")
              if root.tag != "tv" or not channels or not programmes:
                  raise SystemExit(f"Fonte XMLTV inválida ou vazia: {path}")
              print(f"{path}: {len(channels)} canais, {len(programmes)} programas")
          PY

          # Arquivar as fontes XMLTV validadas diretamente junto aos guias EPG.
          mkdir -p epg
          rm -rf epg/fontes
          cp /tmp/epg-principal.xml epg/turksat-principal.xml
          for item in "open-turkey1:open-epg-turkey1" "open-turkey2:open-epg-turkey2" "open-turkey3:open-epg-turkey3" "open-turkey4:open-epg-turkey4"; do
            src="${item%%:*}"; dest="${item##*:}"
            cp "/tmp/${src}.xml" "epg/${dest}.xml"
          done
          for item in "epgshare-tr1:epgshare-tr1" "epgshare-tr3:epgshare-tr3" "free-epg-tr:free-epg-turquia" "ghaleb-turkish:ghaleb-turkish" "hayatiptv-turkey:hayatiptv-turquia" "teleonline-global:teleonline-global" "iptv-epg-tr:iptv-epg-turquia" "epgfull-turquia:epgfull-turquia" "epghost-turkey:epghost-turquia" "iptv-org-turquia:iptv-org-turquia" "iptv-org-tvplus:iptv-org-tvplus" "iptv-org-digiturk:iptv-org-digiturk" "iptv-org-dsmart:iptv-org-dsmart" "iptv-org-turksat-kablo:iptv-org-turksat-kablo"; do
            src="${item%%:*}"; dest="${item##*:}"
            [[ ! -s "/tmp/${src}.xml" ]] || cp "/tmp/${src}.xml" "epg/${dest}.xml"
          done

      - name: Gerar guia exclusivo Open-EPG
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for file in /tmp/open-turkey1.xml /tmp/open-turkey2.xml /tmp/open-turkey3.xml /tmp/open-turkey4.xml /tmp/epgshare-tr1.xml /tmp/epgshare-tr3.xml /tmp/free-epg-tr.xml /tmp/ghaleb-turkish.xml /tmp/hayatiptv-turkey.xml /tmp/teleonline-global.xml /tmp/iptv-epg-tr.xml /tmp/epgfull-turquia.xml /tmp/epghost-turkey.xml /tmp/iptv-org-turquia.xml /tmp/iptv-org-tvplus.xml /tmp/iptv-org-digiturk.xml /tmp/iptv-org-dsmart.xml /tmp/iptv-org-turksat-kablo.xml; do
            [[ -s "$file" ]] && args+=(--input "$file")
          done
          python3 scripts/sincronizar_epg.py --playlist Tv.m3u8 "${args[@]}" --output epg/guia-open-epg.xml

      - name: Combinar todas as fontes XMLTV com a fonte principal
        shell: bash
        run: |
          set -euo pipefail
          args=(--input /tmp/epg-principal.xml)
          for file in /tmp/open-turkey1.xml /tmp/open-turkey2.xml /tmp/open-turkey3.xml /tmp/open-turkey4.xml /tmp/epgshare-tr1.xml /tmp/epgshare-tr3.xml /tmp/free-epg-tr.xml /tmp/ghaleb-turkish.xml /tmp/hayatiptv-turkey.xml /tmp/teleonline-global.xml /tmp/iptv-epg-tr.xml /tmp/iptv-org-turquia.xml /tmp/iptv-org-tvplus.xml /tmp/iptv-org-digiturk.xml /tmp/iptv-org-dsmart.xml /tmp/iptv-org-turksat-kablo.xml; do
            [[ -s "$file" ]] && args+=(--input "$file")
          done
          python3 scripts/sincronizar_epg.py --playlist Tv.m3u8 "${args[@]}" --output epg/guia-turquia.xml

      - name: Validar e publicar os dois guias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          expected = sum(1 for line in open("Tv.m3u8", encoding="utf-8") if line.startswith("#EXTINF:"))
          for path in ["epg/guia-open-epg.xml", "epg/guia-turquia.xml"]:
              root = ET.parse(path).getroot()
              channels, programmes = root.findall("channel"), root.findall("programme")
              ids = {c.get("id") for c in channels}
              if len(channels) != expected:
                  raise SystemExit(f"{path}: {len(channels)} de {expected} canais; publicação cancelada.")
              if not programmes or any(p.get("channel") not in ids for p in programmes):
                  raise SystemExit(f"{path}: programação vazia ou referência inválida.")
              print(f"{path}: {len(channels)} canais, {len(programmes)} programas.")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A epg/
          if git diff --cached --quiet; then
            echo "EPGs sem alterações."
          else
            git commit -m "Adiciona Open-EPG Turkey e combina programação"
            git push
          fi
