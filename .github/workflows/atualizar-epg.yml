name: Atualizar tele guia próprio

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "scripts/sincronizar_epg.py"
      - ".github/workflows/atualizar-epg.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sincronizar-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Baixar fontes XMLTV com programação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          sources = {
              "epg-source-tr.xml": "https://iptv-epg.org/files/epg-tr.xml",
              "epg-source-lite.xml": "https://epg.pw/xmltv/epg_lite.xml",
          }
          for filename, url in sources.items():
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 PlaylistTurquiaEPG"})
              with urllib.request.urlopen(req, timeout=120) as response:
                  data = response.read()
              if not data.lstrip().startswith(b"<?xml") and b"<tv" not in data[:500]:
                  raise SystemExit(f"Fonte XMLTV inválida: {url}")
              open(filename, "wb").write(data)
          PY

      - name: Sincronizar todos os canais da TV principal
        run: |
          set -euo pipefail
          python3 scripts/sincronizar_epg.py \
            --playlist Tv.m3u8 \
            --input epg-source-tr.xml \
            --input epg-source-lite.xml \
            --output epg/guia-proprio.xml
          rm -f epg-source-tr.xml epg-source-lite.xml

      - name: Publicar XMLTV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guia-proprio.xml
          if git diff --cached --quiet; then
            echo 'Tele guia sem alterações.'
          else
            git commit -m 'Sincroniza tele guia com todos os canais da TV principal'
            git push
          fi
