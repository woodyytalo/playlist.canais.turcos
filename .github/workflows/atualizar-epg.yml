                      label = n.group(1) if n else display
                      break
              node = ET.Element('channel', {'id': channel_id})
              ET.SubElement(node, 'display-name').text = label
              root.append(node)
              added += 1

          # Mantém o XMLTV íntegro e valida o resultado antes de publicar.
          channels = len(root.findall('channel'))
          programmes = len(root.findall('programme'))
          if not channels or not programmes:
              raise SystemExit('XMLTV inválido após incluir canais.')
          Path('epg').mkdir(exist_ok=True)
          ET.ElementTree(root).write('epg/epg-pw.xml', encoding='utf-8', xml_declaration=True)
          print(f'EPG atualizado: {channels} canais, {programmes} programas, {added} entradas de canal adicionadas. Canais sem dados do provedor ficam sem horários inventados.')
