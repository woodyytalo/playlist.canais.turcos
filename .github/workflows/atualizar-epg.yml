name: Atualizar EPG IA

on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/atualizar-epg.yml"
      - "Tv.m3u8"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  atualizar-epg-ia:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Baixar e validar somente o XML do EPG.PW
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, re, html
          from pathlib import Path
          url = 'https://epg.pw/xmltv/epg_lite.xml'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 PlaylistTurquiaEPG'})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read()
          root = ET.fromstring(data)
          if root.tag != 'tv':
              raise SystemExit('O arquivo recebido não é XMLTV.')
          if not root.findall('channel') or not root.findall('programme'):
              raise SystemExit('XMLTV sem canais ou sem programação; arquivo anterior preservado.')

          # Inclui no XMLTV todos os IDs declarados na playlist principal.
          # Para canais sem tvg-id, usa IDs locais estáveis; isso cria a entrada
          # do canal no guia, mas não inventa horários de programação.
          playlist = Path('Tv.m3u8').read_text(encoding='utf-8')
          entries = re.findall(r'^#EXTINF:[^,]*,(.*)
