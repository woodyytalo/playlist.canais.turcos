      - name: Publicar somente o XML gerado pelo EPG.PW
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/epg-pw.xml
          if git diff --cached --quiet; then
            echo 'XML do EPG.PW sem alterações.'
          else
            git commit -m 'Atualiza XMLTV gerado pelo EPG.PW'
            git push
