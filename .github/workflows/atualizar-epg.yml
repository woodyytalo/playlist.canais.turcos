name: Atualizar tele guia próprio

on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "scripts/sincronizar_epg.py"
      - ".github/workflows/atualizar-epg.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sincronizar-epg:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Obter programação da fonte XMLTV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          url = "https://epg.pw/xmltv/epg_lite.xml"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 PlaylistTurquiaEPG"})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read()
          open("epg-source.xml", "wb").write(data)
          PY

      - name: Sincronizar canais da TV principal no tele guia
        run: |
          set -euo pipefail
          python3 scripts/sincronizar_epg.py --playlist Tv.m3u8 --input epg-source.xml --output epg/guia-proprio.xml
          rm -f epg-source.xml

      - name: Publicar XMLTV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guia-proprio.xml
          if git diff --cached --quiet; then
            echo 'Tele guia sem alterações.'
          else
            git commit -m 'Sincroniza tele guia próprio com a TV principal'
            git push
          fi
