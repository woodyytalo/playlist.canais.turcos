name: Atualizar EPG Turquia e sincronizar canais

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "scripts/sincronizar_epg.py"
      - ".github/workflows/atualizar-epg.yml"
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  sincronizar-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar EPG Turkey atualizado
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://raw.githubusercontent.com/trology85/iptv-epg-turkey/main/epg/turksat_epg.xml" \
            --output /tmp/epg-turquia-fonte.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/epg-turquia-fonte.xml").getroot()
          channels = root.findall("channel")
          programmes = root.findall("programme")
          if root.tag != "tv" or not channels or not programmes:
              raise SystemExit("Fonte IPTV EPG Turkey sem canais/programação; publicação cancelada.")
          print(f"Fonte validada: {len(channels)} canais e {len(programmes)} programas.")
          PY

      - name: Sincronizar com todos os canais da Tv.m3u8
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sincronizar_epg.py \
            --playlist Tv.m3u8 \
            --input /tmp/epg-turquia-fonte.xml \
            --output epg/guia-turquia.xml

      - name: Validar e publicar guia
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("epg/guia-turquia.xml").getroot()
          channels = root.findall("channel")
          programmes = root.findall("programme")
          ids = {c.get("id") for c in channels}
          expected = sum(1 for line in open("Tv.m3u8", encoding="utf-8") if line.startswith("#EXTINF:"))
          if len(channels) != expected:
              raise SystemExit(f"Guia incompleto: {len(channels)} de {expected} canais; publicação cancelada.")
          if not programmes:
              raise SystemExit("Guia sem programação real; publicação cancelada.")
          if any(p.get("channel") not in ids for p in programmes):
              raise SystemExit("Há programas apontando para canais inexistentes.")
          print(f"Guia pronto: {len(channels)} canais declarados e {len(programmes)} programas reais.")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guia-turquia.xml
          if git diff --cached --quiet; then
            echo "EPG sem alterações."
          else
            git commit -m "Atualiza EPG Turquia e sincroniza canais"
            git push
          fi
