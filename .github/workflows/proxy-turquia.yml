name: Testar canais por proxies da Turquia

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u"
      - "scripts/proxy_turquia.py"
      - ".github/workflows/proxy-turquia.yml"

permissions:
  contents: read

concurrency:
  group: proxy-turquia-tv-principal
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --upgrade requests "requests[socks]"
      - name: Testar proxies turcos e canais
        run: python scripts/proxy_turquia.py
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-proxy-turquia
          path: relatorio-proxy-turquia/
          if-no-files-found: warn
          retention-days: 14
