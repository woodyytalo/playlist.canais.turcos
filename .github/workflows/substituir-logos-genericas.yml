name: Substituir logos genéricas por originais
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/substituir_logos_genericas.py"
      - ".github/workflows/substituir-logos-genericas.yml"
jobs:
  substituir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: pip install pillow
      - name: Baixar e normalizar logos originais
        run: python scripts/substituir_logos_genericas.py
      - name: Salvar logos atualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/014-Anadolu-TV-fc2e70f890.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/184-MADINAH-TV-7d10e449b9.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/202-IQ-Channel-8da53c150e.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Substituir logos genéricas por logos originais"
            git push
          fi
