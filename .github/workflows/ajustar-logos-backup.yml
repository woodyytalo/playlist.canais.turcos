name: Ajustar logos do backup
on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "scripts/ajustar_logos_backup.py"
      - ".github/workflows/ajustar-logos-backup.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow
      - name: Ajustar logos e atualizar TV principal
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ajustar_logos_backup.py
      - name: Validar TV principal antes de publicar
        run: python scripts/validar_playlist_anti_crash.py Tv.m3u
      - name: Salvar PNGs e playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-ajustadas Tv.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Ajusta logos do backup para 600x400"
            git push
          else
            echo "Nenhuma logo nova válida encontrada."
          fi
