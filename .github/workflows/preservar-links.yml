name: Preservar links IPTV

on:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
      - "TV2.m3u8"
      - "Euro.m3u"
      - "Tvt.m3u"
      - "Backup.m3u8"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preservar-links-iptv
  cancel-in-progress: false

jobs:
  preservar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Criar snapshots das playlists
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p historico-links
          files=("Tv.m3u8" "TV2.m3u8" "Euro.m3u" "Tvt.m3u" "Backup.m3u8")
          timestamp="$(date -u +'%Y-%m-%d_%H-%M-%S_UTC')_run-${RUN_ID}"

          # Guarda a versão anterior de cada playlist alterada.
          if [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            mkdir -p "historico-links/antes-de-alteracoes/$timestamp"
            for file in "${files[@]}"; do
              if git cat-file -e "$EVENT_BEFORE:$file" 2>/dev/null; then
                if ! git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- "$file"; then
                  git show "$EVENT_BEFORE:$file" > "historico-links/antes-de-alteracoes/$timestamp/$file"
                fi
              fi
            done

            # Quando canais novos entram na TV principal, arquiva também
            # a playlist atual e uma relação dos canais/URLs adicionados.
            if git cat-file -e "$EVENT_BEFORE:Tv.m3u8" 2>/dev/null && ! git diff --quiet "$EVENT_BEFORE" "$GITHUB_SHA" -- Tv.m3u8; then
              python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ["EVENT_BEFORE"]
          after = os.environ["GITHUB_SHA"]
          diff = subprocess.run(
              ["git", "diff", "--no-ext-diff", "--unified=0", before, after, "--", "Tv.m3u8"],
              check=True, capture_output=True, text=True, encoding="utf-8"
          ).stdout.splitlines()

          added = []
          pending = None
          for row in diff:
              if row.startswith("+++") or row.startswith("---"):
                  continue
              if row.startswith("+"):
                  value = row[1:].strip()
                  if value.startswith("#EXTINF:"):
                      if pending:
                          added.append((pending, "URL não identificada no mesmo bloco de diff"))
                      pending = value
                  elif pending and value and not value.startswith("#"):
                      added.append((pending, value))
                      pending = None
          if pending:
              added.append((pending, "URL não identificada no mesmo bloco de diff"))

          if added:
              stamp = os.environ["TIMESTAMP"]
              folder = Path("historico-links/adicoes") / stamp
              folder.mkdir(parents=True, exist_ok=True)
              Path("Tv.m3u8").replace(folder / "Tv.m3u8")
              # Restaura a playlist ativa exatamente como estava no checkout.
              subprocess.run(["git", "checkout", after, "--", "Tv.m3u8"], check=True)
              report = ["Canais adicionados à TV principal neste commit:", ""]
              for entry, url in added:
                  name = entry.rsplit(",", 1)[-1].strip()
                  report.extend([f"Canal: {name}", entry, f"Link: {url}", ""])
              (folder / "canais-adicionados.txt").write_text(
                  "\n".join(report), encoding="utf-8"
              )
              print(f"{len(added)} canal(is) novo(s) preservado(s) com seus links.")
          else:
              print("Nenhum canal novo detectado na TV principal.")
          PY
            fi
          fi

          # Snapshot diário ou manual de todas as listas existentes.
          if [[ "$EVENT_NAME" != "push" ]]; then
            mkdir -p "historico-links/snapshots/$timestamp"
            for file in "${files[@]}"; do
              if [[ -f "$file" ]]; then
                cp "$file" "historico-links/snapshots/$timestamp/$file"
              fi
            done
          fi

          # Registra hashes para facilitar a conferência de integridade.
          find historico-links -type f -name '*.m3u*' -print0 | sort -z | xargs -0 -r sha256sum > historico-links/SHA256SUMS
        env:
          TIMESTAMP: ${{ github.run_id }}

      - name: Salvar histórico no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico-links/
          if git diff --cached --quiet; then
            echo "Nenhum snapshot novo para salvar."
            exit 0
          fi
          git commit -m "Preservar histórico das playlists IPTV"
          git push
