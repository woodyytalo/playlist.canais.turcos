name: Gerar logos originais dos canais
on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/gerar-logos-canais.yml"
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
          fetch-depth: 0
      - name: Recuperar somente logos originais e ajustar para 256x256
        run: |
          python -m pip install Pillow
          python - <<'PY'
          import os, shutil, subprocess
          from io import BytesIO
          from PIL import Image
          old = "78f2a0c6a249634013c75a4fa4fb07029bd619aa"
          out = "logos-canais"
          if os.path.exists(out):
              shutil.rmtree(out)
          os.makedirs(out)
          paths = subprocess.check_output(["git","ls-tree","-r","--name-only",old,"assets/logos"]).decode().splitlines()
          count = 0
          skipped_custom = 0
          for path in paths:
              base = os.path.basename(path).lower()
              if base.startswith("custom-") or "/custom-" in path.lower():
                  skipped_custom += 1
                  continue
              if not path.lower().endswith((".png",".jpg",".jpeg",".webp")):
                  continue
              try:
                  raw = subprocess.check_output(["git","show",f"{old}:{path}"])
                  im = Image.open(BytesIO(raw)).convert("RGBA")
                  im.thumbnail((224, 224), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGBA", (256, 256), (0,0,0,255))
                  canvas.alpha_composite(im, ((256-im.width)//2, (256-im.height)//2))
                  name = os.path.basename(path).rsplit(".",1)[0] + ".png"
                  canvas.convert("RGB").save(os.path.join(out,name), "PNG", optimize=True)
                  count += 1
              except Exception as e:
                  print(f"Skipped {path}: {e}")
          with open(os.path.join(out,"README.txt"),"w") as f:
              f.write(f"{count} logos de arquivos originais; PNG 256x256 px; proporcao 1:1; fundo preto; marcas sem redesenho.\\n")
          print(f"Logos originais geradas: {count}; customizadas ignoradas: {skipped_custom}")
          PY

      - name: Baixar todas as imagens PNG do TVLogo.org Turquia
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import os, time
          base = "https://www.tvlogo.org/turkey/"
          out = "logos-tvlogo-turquia"
          os.makedirs(out, exist_ok=True)
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href=dict(attrs).get("href","")
                      if href.lower().endswith(".png"):
                          self.hrefs.append(href)
          req=Request(base, headers={"User-Agent":"Mozilla/5.0 (compatible; logo-archive/1.0)"})
          with urlopen(req, timeout=30) as r:
              html=r.read().decode("utf-8","replace")
          parser=Links()
          parser.feed(html)
          names=sorted(set(parser.hrefs))
          if not names:
              raise SystemExit("Nenhum PNG foi listado pelo diretório TVLogo.org; nada foi gravado.")
          ok=0
          failed=[]
          for name in names:
              url=urljoin(base,name)
              try:
                  req=Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; logo-archive/1.0)"})
                  with urlopen(req, timeout=30) as r:
                      data=r.read()
                  if not data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"):
                      raise ValueError("resposta não é PNG válido")
                  with open(os.path.join(out,os.path.basename(name)),"wb") as f:
                      f.write(data)
                  ok+=1
              except Exception as e:
                  failed.append((name,str(e)))
              time.sleep(0.05)
          with open(os.path.join(out,"README.txt"),"w",encoding="utf-8") as f:
              f.write("Imagens PNG obtidas do diretório público TVLogo.org /turkey/.\\n")
              f.write("Fonte: https://www.tvlogo.org/turkey/\\n")
              f.write(f"Baixadas: {ok} de {len(names)} listadas.\\n")
              if failed:
                  f.write("Falhas:\\n")
                  for name,err in failed:
                      f.write(f"{name}: {err}\\n")
          print(f"PNGs baixadas: {ok}/{len(names)}")
          if failed:
              print("Falhas:", failed)
          if ok == 0:
              raise SystemExit("Nenhuma imagem foi baixada.")
          PY
      - name: Salvar pasta no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logos-canais
          git commit -m "Gerar somente logos originais em 256x256" || echo "Sem alterações"
          git push origin HEAD:github/workflows/atualizar-logos.yml
