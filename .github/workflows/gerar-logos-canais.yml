name: Baixar logos originais do TVLogo.org
on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/gerar-logos-canais.yml"
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
          fetch-depth: 0
      - name: Baixar PNGs do diretório oficial TVLogo.org - Turquia
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          INDEX = "https://www.tvlogo.org/turkey/"
          OUT = "logos-tvlogo-turquia"

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      href = dict(attrs).get("href", "")
                      if href.lower().endswith(".png"):
                          self.hrefs.append(href)

          req = urllib.request.Request(INDEX, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")

          parser = Links()
          parser.feed(html)
          urls = []
          seen = set()
          for href in parser.hrefs:
              url = urljoin(INDEX, href)
              name = os.path.basename(urlparse(url).path)
              if name and name not in seen:
                  seen.add(name)
                  urls.append((name, url))

          if not urls:
              raise SystemExit("O diretório não retornou links PNG; nenhuma pasta foi substituída.")

          os.makedirs(OUT, exist_ok=True)
          downloaded = 0
          failed = []
          for name, url in urls:
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()
                  if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise ValueError("resposta não é um PNG válido")
                  with open(os.path.join(OUT, name), "wb") as f:
                      f.write(data)
                  downloaded += 1
                  print("Baixado:", name)
              except Exception as exc:
                  failed.append((name, str(exc)))
                  print("Falha:", name, exc)

          with open(os.path.join(OUT, "README.txt"), "w", encoding="utf-8") as f:
              f.write("Logos PNG originais baixadas do diretório oficial https://www.tvlogo.org/turkey/\\n")
              f.write(f"Arquivos baixados: {downloaded}\\n")
              f.write(f"Falhas: {len(failed)}\\n")
              for name, error in failed:
                  f.write(f"{name}: {error}\\n")

          if downloaded == 0:
              raise SystemExit("Nenhuma imagem PNG foi baixada.")
          print(f"Total de PNGs baixados: {downloaded}; falhas: {len(failed)}")
          PY
      - name: Padronizar logos em PNG 2:1 com fundo preto
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          
          folder = Path("logos-tvlogo-turquia")
          canvas_size = (1200, 600)
          max_logo_size = (1080, 480)
          processed = 0
          
          for path in sorted(folder.glob("*.png")):
              with Image.open(path) as source:
                  image = source.convert("RGBA")
                  # Remove apenas o fundo quase branco conectado às bordas;
                  # áreas brancas internas da marca permanecem preservadas.
                  for point in [(0, 0), (image.width - 1, 0),
                                (0, image.height - 1),
                                (image.width - 1, image.height - 1)]:
                      px = image.getpixel(point)
                      if min(px[:3]) >= 235 and px[3] > 0:
                          ImageDraw.floodfill(image, point, (0, 0, 0, 0), thresh=22)
                  image.thumbnail(max_logo_size, Image.Resampling.LANCZOS)
                  background = Image.new("RGBA", canvas_size, (0, 0, 0, 255))
                  x = (canvas_size[0] - image.width) // 2
                  y = (canvas_size[1] - image.height) // 2
                  background.alpha_composite(image, (x, y))
                  background.convert("RGB").save(path, format="PNG", optimize=True)
                  processed += 1
          
          if processed == 0:
              raise SystemExit("Nenhum PNG encontrado para padronizar.")
          print(f"Logos padronizadas: {processed}; tamanho final: 1200x600; proporção: 2:1")
          PY
      - name: Salvar PNGs na pasta do repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logos-tvlogo-turquia
          git commit -m "Baixar logos originais do TVLogo.org Turquia" || echo "Sem alterações"
          git push origin HEAD:github/workflows/atualizar-logos.yml
