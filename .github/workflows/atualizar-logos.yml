name: Atualizar logos dos canais

on:
  # Executa automaticamente quando a TV principal recebe alterações.
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u8"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  atualizar-logos:
    # Evita executar em commits gerados pelo próprio bot.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Garantir teleguia automático para canais novos
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Tv.m3u8")
          lines = path.read_text(encoding="utf-8").splitlines()
          epg = "https://iptv-epg.org/files/epg-tr.xml"

          # Mantém o cabeçalho XMLTV sempre presente para todos os canais da lista.
          if lines and lines[0].startswith("#EXTM3U"):
              header = lines[0]
              if "url-tvg=" not in header:
                  header += f' url-tvg="{epg}"'
              if "x-tvg-url=" not in header:
                  header += f' x-tvg-url="{epg}"'
              lines[0] = header
          else:
              lines.insert(0, f'#EXTM3U url-tvg="{epg}" x-tvg-url="{epg}"')

          # Para entradas novas, completa tvg-name com o nome exibido se estiver ausente.
          # Não inventa tvg-id: o ID precisa corresponder ao channel id do XMLTV.
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              display = line.rsplit(",", 1)[-1].strip()
              if display and not re.search(r'\btvg-name="[^"]+"', line, re.I):
                  line = re.sub(r"^#EXTINF:([^,]*),", lambda m: m.group(0).replace(",", f' tvg-name="{display}",', 1), line, count=1)
                  lines[i] = line

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Cabeçalho XMLTV garantido e tvg-name preenchido quando ausente.")
          PY

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Priorizar qualidade SD automaticamente
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin
          from pathlib import Path

          path = Path("Tv.m3u8")
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          changed = 0
          current_name = "Canal sem nome"

          def get_sd_variant(url):
              # Só troca quando a própria playlist HLS anuncia uma variante
              # SD explícita. Se não for possível confirmar, mantém o link original.
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      if response.status != 200:
                          return None
                      body = response.read(512 * 1024).decode("utf-8", "replace")
                  if "#EXT-X-STREAM-INF" not in body:
                      return None

                  variants = []
                  pending = None
                  for row in body.splitlines():
                      row = row.strip()
                      if row.startswith("#EXT-X-STREAM-INF:"):
                          match = re.search(r"RESOLUTION=(\d+)x(\d+)", row)
                          pending = (int(match.group(1)), int(match.group(2))) if match else None
                      elif row and not row.startswith("#") and pending:
                          width, height = pending
                          if width <= 854 and height <= 480:
                              variants.append((width * height, urljoin(url, row)))
                          pending = None
                  if not variants:
                      return None
                  return max(variants, key=lambda item: item[0])[1]
              except Exception as exc:
                  print(f"SD não confirmado para {current_name}: {exc}")
                  return None

          for line in lines:
              if line.startswith("#EXTINF"):
                  current_name = line.rsplit(",", 1)[-1].strip()
              if line.startswith(("http://", "https://")) and ".m3u8" in line.lower():
                  # Mantém o fragmento e parâmetros do URL original quando não se
                  # consegue validar uma variante SD diretamente no master.
                  target = get_sd_variant(line)
                  if target and target != line:
                      print(f"SD selecionado: {current_name}")
                      line = target
                      changed += 1
              updated.append(line)

          if changed:
              path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          print(f"Variantes SD selecionadas: {changed}; links sem SD confirmado foram preservados.")
          PY

      - name: Encontrar e adicionar logos PNG
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path
          
          main = Path("Tv.m3u8")
          if not main.exists():
              raise SystemExit("ERRO: Tv.m3u8 não foi encontrado.")

          # Fontes locais: reutiliza logos já existentes nas outras playlists
          # quando o nome do canal corresponde exatamente.
          playlists = [
              Path("TV2.m3u8"), Path("Euro.m3u"),
              Path("Tvt.m3u"), Path("Backup.m3u8")
          ]

          def normalize(value):
              value = value.casefold().strip()
              value = re.sub(r"\s*\([^)]*\)", "", value)
              value = re.sub(r"\s*\[[^]]*\]", "", value)
              return re.sub(r"[^a-z0-9]+", "", value)

          def parse_logo(line):
              match = re.search(r'tvg-logo="([^"]+)"', line, re.I)
              return match.group(1) if match else None

          known_logos = {
              "Power Dance TV": "https://www.tvlogo.org/turkey/power-dance-tv-tr.png",
              "Power Love TV": "https://www.tvlogo.org/turkey/power-love-tv-tr.png",
              "PowerTürk Akustik TV": "https://www.tvlogo.org/turkey/powerturk-akustik-tr.png",
              "Diyanet TV": "https://www.tvlogo.org/turkey/diyanet-tv-tr.png",
              "Dost TV": "https://www.tvlogo.org/turkey/dost-tv-tr.png",
              "Lalegül TV": "https://www.tvlogo.org/turkey/lalegul-tv-tr.png",
              "Sercem TV": "https://www.lyngsat.com/logo/tv/ss/sercem-tv-tr.png",
              "Sözcü TV": "https://i.ibb.co/B40rjP3/szc1.png",
              "TBMM TV (720p)": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/TBMM_TV_logo.svg/960px-TBMM_TV_logo.svg.png",
              "PowerTürk TV (720p)": "https://www.tvlogo.org/turkey/powerturk-tr.png",
          }

          # Indexa nomes e logos já presentes nas listas secundárias.
          logo_by_name = {}
          for file in playlists:
              if not file.exists():
                  continue
              for line in file.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.startswith("#EXTINF"):
                      logo = parse_logo(line)
                      name = line.rsplit(",", 1)[-1].strip()
                      if logo and name:
                          logo_by_name.setdefault(normalize(name), logo)

          def image_is_png(url):
              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status != 200:
                          return False
                      content_type = response.headers.get("Content-Type", "").lower()
                      data = response.read(16)
                      return content_type.startswith("image/") and data.startswith(b"\x89PNG\r\n\x1a\n")
              except Exception as error:
                  print(f"Logo não validado ({url}): {error}")
                  return False

          lines = main.read_text(encoding="utf-8").splitlines()
          updated = []
          changed = False
          added = 0

          for line in lines:
              if line.startswith("#EXTINF") and not parse_logo(line):
                  name = line.rsplit(",", 1)[-1].strip()
                  candidate = logo_by_name.get(normalize(name)) or known_logos.get(name)
                  if candidate and image_is_png(candidate):
                      line = line.replace(
                          "#EXTINF:",
                          f'#EXTINF: tvg-logo="{candidate}"',
                          1
                      )
                      if 'tvg-logo="' in line:
                          changed = True
                          added += 1
                          print(f"PNG validado e adicionado: {name}")
                  else:
                      print(f"Sem PNG confiável encontrado: {name}")
              updated.append(line)

          if changed:
              main.write_text("\n".join(updated) + "\n", encoding="utf-8")
              print(f"Total de logos PNG adicionados: {added}")
          else:
              print("Nenhum PNG novo validado; playlist mantida sem alterações.")
          PY

      - name: Aplicar buffer e proteção contra interrupções em todos os canais
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Tv.m3u8")
          lines = path.read_text(encoding="utf-8").splitlines()
          result = []
          channels = 0
          i = 0

          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  result.append(lines[i])
                  i += 1
                  continue

              channels += 1
              result.append(lines[i])
              i += 1
              block = []
              while i < len(lines) and not lines[i].startswith("#EXTINF"):
                  block.append(lines[i])
                  i += 1

              cache_written = False
              clean_block = []
              for item in block:
                  if item.strip().lower().startswith("#extvlcopt:network-caching="):
                      if not cache_written:
                          clean_block.append("#EXTVLCOPT:network-caching=60000")
                          cache_written = True
                  else:
                      clean_block.append(item)

              if not cache_written:
                  clean_block.insert(0, "#EXTVLCOPT:network-caching=60000")
              result.extend(clean_block)

          path.write_text("\n".join(result) + "\n", encoding="utf-8")
          print(f"Buffer de 60 segundos aplicado em {channels} canais.")
          PY

      - name: Salvar alterações
        run: |
          if git diff --quiet -- Tv.m3u8; then
            echo "Nenhuma alteração para salvar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Tv.m3u8
            git commit -m "Adicionar logos PNG automaticamente"
            git push
          fi

      - name: Disparar sincronização do EPG após atualizar a TV principal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run atualizar-epg.yml --ref "${GITHUB_REF_NAME}"
          echo "Sincronização do EPG solicitada para a versão atualizada de Tv.m3u8."
