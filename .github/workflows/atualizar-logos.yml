name: Automação da TV principal (EPG e buffer)

on:
  workflow_dispatch:
  # Executa automaticamente quando a TV principal recebe alterações.
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u"
      - ".github/workflows/atualizar-logos.yml"
  schedule:
    - cron: "10 0,12 * * *"

permissions:
  contents: write
  actions: write

jobs:
  atualizar-tv-principal:
    # Executa também em commits automáticos; o passo de commit só grava quando há diferenças,
    # evitando ciclos quando a playlist já está normalizada.
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir automaticamente nomes e remover números de catálogo
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:") or "," not in line:
                  continue
              prefix, display = line.rsplit(",", 1)
              # Remove apenas números de catálogo no início do título (ex.: 148 - Canal).
              # Não altera números que fazem parte do nome (ex.: 1Mus, TV 1, 24 TV).
              clean = re.sub(r"^\s*\d+\s*[-–—.)]\s*", "", display).strip()
              if clean != display.strip():
                  lines[i] = prefix + "," + clean
                  changed += 1
          if changed:
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Nomes corrigidos automaticamente: {changed}; títulos sem numeração de catálogo.")
          PY

      - name: Garantir teleguia automático para canais novos
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          epg = "https://iptv-epg.org/files/epg-tr.xml"

          # Mantém o cabeçalho XMLTV sempre presente para todos os canais da lista.
          if lines and lines[0].startswith("#EXTM3U"):
              header = lines[0]
              if "url-tvg=" not in header:
                  header += f' url-tvg="{epg}"'
              if "x-tvg-url=" not in header:
                  header += f' x-tvg-url="{epg}"'
              lines[0] = header
          else:
              lines.insert(0, f'#EXTM3U url-tvg="{epg}" x-tvg-url="{epg}"')

          # Para entradas novas, completa tvg-name com o nome exibido se estiver ausente.
          # Não inventa tvg-id: o ID precisa corresponder ao channel id do XMLTV.
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              display = line.rsplit(",", 1)[-1].strip()
              if display and not re.search(r'\btvg-name="[^"]+"', line, re.I):
                  line = re.sub(r"^#EXTINF:([^,]*),", lambda m: m.group(0).replace(",", f' tvg-name="{display}",', 1), line, count=1)
                  lines[i] = line

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Cabeçalho XMLTV garantido e tvg-name preenchido quando ausente.")
          PY

      - name: Aplicar buffer e proteção contra interrupções em todos os canais
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          result = []
          channels = 0
          i = 0

          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  result.append(lines[i])
                  i += 1
                  continue

              channels += 1
              result.append(lines[i])
              i += 1
              block = []
              while i < len(lines) and not lines[i].startswith("#EXTINF"):
                  block.append(lines[i])
                  i += 1

              cache_written = False
              clean_block = []
              for item in block:
                  if item.strip().lower().startswith("#extvlcopt:network-caching="):
                      if not cache_written:
                          clean_block.append("#EXTVLCOPT:network-caching=1000")
                          cache_written = True
                  else:
                      clean_block.append(item)

              if not cache_written:
                  clean_block.insert(0, "#EXTVLCOPT:network-caching=1000")
              result.extend(clean_block)

          path.write_text("\n".join(result) + "\n", encoding="utf-8")
          print(f"Buffer de 1 segundo aplicado em {channels} canais.")
          PY

      - name: Preparar ferramentas para padronizar logos existentes em 512x165
        run: python -m pip install --quiet pillow cairosvg

      - name: Padronizar somente as logos já usadas na TV principal (512x165)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, unquote
          from io import BytesIO
          from PIL import Image
          import cairosvg, re

          playlist = Path("Tv.m3u")
          lines = playlist.read_text(encoding="utf-8").splitlines()
          root = Path("logos-ajustadas")
          branch_path = "github/workflows/atualizar-logos.yml/"
          raw_prefix = "woodyytalo/playlist.canais.turcos/"
          base = "https://raw.githubusercontent.com/woodyytalo/playlist.canais.turcos/" + branch_path

          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", value.lower()).strip("-") or "canal"

          def read_source(url):
              parsed = urlparse(url)
              local_path = unquote(parsed.path).lstrip("/")
              if parsed.netloc == "raw.githubusercontent.com" and local_path.startswith(raw_prefix):
                  local_path = local_path[len(raw_prefix):]
                  if local_path.startswith(branch_path):
                      local_path = local_path[len(branch_path):]
                  candidate = Path(local_path)
                  if candidate.is_file():
                      return candidate.read_bytes()
              request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urlopen(request, timeout=30) as response:
                  return response.read()

          def normalize(raw):
              if raw.lstrip().startswith(b"<") or b"<svg" in raw[:4096].lower():
                  raw = cairosvg.svg2png(bytestring=raw)
              image = Image.open(BytesIO(raw)).convert("RGBA")
              bounds = image.getchannel("A").getbbox()
              if bounds:
                  image = image.crop(bounds)
              image.thumbnail((492, 145), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (512, 165), (0, 0, 0, 255))
              canvas.alpha_composite(image, ((512-image.width)//2, (165-image.height)//2))
              output = BytesIO()
              canvas.convert("RGB").save(output, format="PNG", optimize=True)
              return output.getvalue()

          completed = 0
          failed = 0
          occurrences = {}
          for index, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              match = re.search(r'tvg-logo="([^"]+)"', line)
              if not match:
                  failed += 1
                  print("SEM LOGO INFORMADA:", line.rsplit(",", 1)[-1])
                  continue
              source_url = match.group(1)
              category_match = re.search(r'group-title="([^"]+)"', line)
              category = category_match.group(1) if category_match else "sem-categoria"
              channel = line.rsplit(",", 1)[-1].strip()
              folder = slug(category)
              stem = slug(channel)
              key = (folder, stem)
              occurrences[key] = occurrences.get(key, 0) + 1
              filename = stem + (f"-{occurrences[key]}" if occurrences[key] > 1 else "") + ".png"
              target = root / folder / filename
              try:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(normalize(read_source(source_url)))
                  new_url = base + "logos-ajustadas/" + folder + "/" + filename
                  lines[index] = line[:match.start(1)] + new_url + line[match.end(1):]
                  completed += 1
                  print(f"PADRONIZADA 512x165: {channel}")
              except Exception as error:
                  failed += 1
                  print(f"MANTIDA SEM ALTERAÇÃO: {channel} ({error})")

          playlist.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Resultado: {completed} logos padronizadas em 512x165; {failed} sem alteração.")
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          set -euo pipefail
          # git diff não detecta arquivos novos não rastreados; usar status para incluir os PNGs recém-gerados.
          if [[ -z "$(git status --porcelain -- Tv.m3u logos-ajustadas logos-turcas-catalogo)" ]]; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tv.m3u logos-ajustadas/ logos-turcas-catalogo/
          git commit -m "Atualizar programação, qualidade e buffer da TV principal"

          # Outros bots também gravam na mesma branch. Rebaseia sobre a versão
          # remota mais recente e tenta novamente para evitar rejeição non-fast-forward.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Conflito ao integrar alterações remotas; tentativa ${attempt}/5."
              sleep 2
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Alterações salvas após sincronização com a branch remota."
              exit 0
            fi
            echo "Push rejeitado; nova tentativa ${attempt}/5."
            sleep 2
          done

          echo "Não foi possível publicar após cinco tentativas."
          exit 1

      - name: Disparar sincronização do EPG após atualizar a TV principal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run atualizar-epg.yml --ref "${GITHUB_REF_NAME}"
          echo "Sincronização do EPG solicitada para a versão atualizada de Tv.m3u."
# Reprocessamento integral das logos da TV principal solicitado.
