name: Automação da TV principal (EPG e buffer)

on:
  workflow_dispatch:
  # Executa automaticamente quando a TV principal recebe alterações.
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "Tv.m3u"
      - ".github/workflows/atualizar-logos.yml"
  schedule:
    - cron: "10 0,12 * * *"

permissions:
  contents: write
  actions: write

jobs:
  atualizar-tv-principal:
    # Executa também em commits automáticos; o passo de commit só grava quando há diferenças,
    # evitando ciclos quando a playlist já está normalizada.
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir automaticamente nomes e remover números de catálogo
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          changed = 0
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:") or "," not in line:
                  continue
              prefix, display = line.rsplit(",", 1)
              # Remove apenas números de catálogo no início do título (ex.: 148 - Canal).
              # Não altera números que fazem parte do nome (ex.: 1Mus, TV 1, 24 TV).
              clean = re.sub(r"^\s*\d+\s*[-–—.)]\s*", "", display).strip()
              if clean != display.strip():
                  lines[i] = prefix + "," + clean
                  changed += 1
          if changed:
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Nomes corrigidos automaticamente: {changed}; títulos sem numeração de catálogo.")
          PY

      - name: Garantir teleguia automático para canais novos
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          epg = "https://iptv-epg.org/files/epg-tr.xml"

          # Mantém o cabeçalho XMLTV sempre presente para todos os canais da lista.
          if lines and lines[0].startswith("#EXTM3U"):
              header = lines[0]
              if "url-tvg=" not in header:
                  header += f' url-tvg="{epg}"'
              if "x-tvg-url=" not in header:
                  header += f' x-tvg-url="{epg}"'
              lines[0] = header
          else:
              lines.insert(0, f'#EXTM3U url-tvg="{epg}" x-tvg-url="{epg}"')

          # Para entradas novas, completa tvg-name com o nome exibido se estiver ausente.
          # Não inventa tvg-id: o ID precisa corresponder ao channel id do XMLTV.
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              display = line.rsplit(",", 1)[-1].strip()
              if display and not re.search(r'\btvg-name="[^"]+"', line, re.I):
                  line = re.sub(r"^#EXTINF:([^,]*),", lambda m: m.group(0).replace(",", f' tvg-name="{display}",', 1), line, count=1)
                  lines[i] = line

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Cabeçalho XMLTV garantido e tvg-name preenchido quando ausente.")
          PY

      - name: Aplicar buffer e proteção contra interrupções em todos os canais
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Tv.m3u")
          lines = path.read_text(encoding="utf-8").splitlines()
          result = []
          channels = 0
          i = 0

          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  result.append(lines[i])
                  i += 1
                  continue

              channels += 1
              result.append(lines[i])
              i += 1
              block = []
              while i < len(lines) and not lines[i].startswith("#EXTINF"):
                  block.append(lines[i])
                  i += 1

              cache_written = False
              clean_block = []
              for item in block:
                  if item.strip().lower().startswith("#extvlcopt:network-caching="):
                      if not cache_written:
                          clean_block.append("#EXTVLCOPT:network-caching=1000")
                          cache_written = True
                  else:
                      clean_block.append(item)

              if not cache_written:
                  clean_block.insert(0, "#EXTVLCOPT:network-caching=1000")
              result.extend(clean_block)

          path.write_text("\n".join(result) + "\n", encoding="utf-8")
          print(f"Buffer de 1 segundo aplicado em {channels} canais.")
          PY

      - name: Preparar ferramentas para logos quadradas no padrão 1:1 (256x256)
        run: |
          python -m pip install --quiet pillow cairosvg

      - name: Importar catálogo de logos turcas em lote (PNG 256x256)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from io import BytesIO
          from PIL import Image
          import json, re, csv

          OUT = Path("logos-turcas-catalogo")
          OUT.mkdir(parents=True, exist_ok=True)
          API = "https://api.github.com/repos/tv-logo/tv-logos/git/trees/main?recursive=1"

          def get(url):
              req = Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; Turkish-TV-Logo-Catalog/1.0)"})
              with urlopen(req, timeout=20) as response:
                  return response.read()

          def normalize(raw):
              im = Image.open(BytesIO(raw)).convert("RGBA")
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.thumbnail((220, 220), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 255))
              canvas.alpha_composite(im, ((256-im.width)//2, (256-im.height)//2))
              return canvas.convert("RGB")

          tree = json.loads(get(API).decode("utf-8"))
          files = [x for x in tree.get("tree", [])
                   if x.get("type") == "blob"
                   and x.get("path", "").lower().startswith("countries/turkey/")
                   and re.search(r"\.png$", x.get("path", ""), re.I)]
          def one(item):
              path = item["path"]
              url = "https://raw.githubusercontent.com/tv-logo/tv-logos/main/" + path
              filename = "tvlogos-github-" + re.sub(r"[^a-z0-9.-]+", "-", path.rsplit("/",1)[-1].lower())
              try:
                  image = normalize(get(url))
                  target = OUT / filename
                  image.save(target, "PNG", optimize=True)
                  return (filename, url, "OK")
              except Exception as exc:
                  return (filename, url, "FALHA: " + str(exc))

          results = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(one, item) for item in files]
              for future in as_completed(futures):
                  result = future.result()
                  results.append(result)
                  print(result[2], result[0])

          with (OUT / "FONTES.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow(["arquivo_png", "url_original", "resultado"])
              writer.writerows(sorted(results))
          ok = sum(1 for x in results if x[2] == "OK")
          print(f"CATÁLOGO TURCO: {ok}/{len(results)} logos importadas e normalizadas em 256x256.")
          PY

      - name: Importar logos adicionais (Wikimedia, TRT oficial e GunesTV)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from io import BytesIO
          from zipfile import ZipFile
          from PIL import Image
          import cairosvg, csv, json, re, html
          
          ROOT = Path("logos-turcas-catalogo/fontes-adicionais")
          ROOT.mkdir(parents=True, exist_ok=True)
          rows = []
          
          def get(url):
              req = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; Turkish-TV-Logo-Catalog/1.0)"})
              with urlopen(req, timeout=35) as response:
                  return response.read()
          
          def slug(value):
              value = re.sub(r"[^a-z0-9]+", "-", value.lower()).strip("-")
              return value[:100] or "logo"
          
          def normalize(raw):
              if b"<svg" in raw[:8192].lower() or raw.lstrip().startswith(b"<?xml"):
                  raw = cairosvg.svg2png(bytestring=raw)
              im = Image.open(BytesIO(raw)).convert("RGBA")
              bbox = im.getchannel("A").getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.thumbnail((220, 220), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 255))
              canvas.alpha_composite(im, ((256-im.width)//2, (256-im.height)//2))
              out = BytesIO()
              canvas.convert("RGB").save(out, format="PNG", optimize=True)
              return out.getvalue()
          
          def save(source, label, url, target_dir, license_name="", credit=""):
              try:
                  raw = get(url)
                  png = normalize(raw)
                  target_dir.mkdir(parents=True, exist_ok=True)
                  filename = slug(label) + ".png"
                  target = target_dir / filename
                  # Avoid collisions when two channels share a title.
                  n = 2
                  while target.exists() and target.read_bytes() != png:
                      target = target_dir / (slug(label) + "-" + str(n) + ".png")
                      n += 1
                  target.write_bytes(png)
                  rows.append([source, label, str(target).replace("\\", "/"), url, license_name, credit, "OK"])
                  print("OK", source, label, target)
              except Exception as exc:
                  rows.append([source, label, "", url, license_name, credit, "FALHA: " + str(exc)])
                  print("FALHA", source, label, exc)
          
          # 1) Wikimedia Commons: category principal + categoria SVG.
          for category in [
              "Category:Logos of television channels in Turkey",
              "Category:SVG logos of television channels in Turkey",
          ]:
              continuation = None
              while True:
                  params = {
                      "action": "query", "generator": "categorymembers",
                      "gcmtitle": category, "gcmtype": "file", "gcmlimit": "500",
                      "prop": "imageinfo", "iiprop": "url|extmetadata", "format": "json"
                  }
                  if continuation:
                      params["gcmcontinue"] = continuation
                  data = json.loads(get("https://commons.wikimedia.org/w/api.php?" + urlencode(params)).decode("utf-8"))
                  pages = data.get("query", {}).get("pages", {})
                  for page in pages.values():
                      info = (page.get("imageinfo") or [{}])[0]
                      url = info.get("url")
                      if not url:
                          continue
                      meta = info.get("extmetadata", {})
                      license_name = html.unescape(meta.get("LicenseShortName", {}).get("value", ""))
                      credit = html.unescape(meta.get("Artist", {}).get("value", ""))
                      title = page.get("title", "logo").replace("File:", "")
                      save("Wikimedia Commons", title, url, ROOT / "wikimedia-commons", license_name, credit)
                  continuation = data.get("continue", {}).get("gcmcontinue")
                  if not continuation:
                      break
          
          # 2) TRT official TV-channel logo pack (ZIP linked by TRT corporate page).
          try:
              archive = ZipFile(BytesIO(get("https://www.trt.net.tr/logos/Televizyon.zip")))
              for member in archive.infolist():
                  if member.is_dir() or not re.search(r"\.(png|jpe?g|webp|gif|svg)$", member.filename, re.I):
                      continue
                  try:
                      png = normalize(archive.read(member))
                      target_dir = ROOT / "trt-oficial"
                      target_dir.mkdir(parents=True, exist_ok=True)
                      target = target_dir / (slug(Path(member.filename).stem) + ".png")
                      target.write_bytes(png)
                      rows.append(["TRT oficial", Path(member.filename).stem, str(target).replace("\\", "/"),
                                   "https://www.trt.net.tr/logos/Televizyon.zip", "TRT - pacote oficial", "TRT Kurumsal", "OK"])
                      print("OK TRT oficial", member.filename)
                  except Exception as exc:
                      rows.append(["TRT oficial", member.filename, "", "https://www.trt.net.tr/logos/Televizyon.zip",
                                   "TRT - pacote oficial", "TRT Kurumsal", "FALHA: " + str(exc)])
                      print("FALHA TRT", member.filename, exc)
          except Exception as exc:
              rows.append(["TRT oficial", "Pacote de logos de televisão", "", "https://www.trt.net.tr/logos/Televizyon.zip",
                           "TRT - pacote oficial", "TRT Kurumsal", "FALHA: " + str(exc)])
              print("FALHA pacote TRT", exc)
          
          # 3) GunesTV: use only logo URLs from entries explicitly marked as Turkey.
          try:
              data = json.loads(get("https://raw.githubusercontent.com/Oktay2617/gunestv/main/channels_turkey.json").decode("utf-8"))
              seen = set()
              for channel in data.get("channels", []):
                  if str(channel.get("country", "")).strip().lower() != "turkey":
                      continue
                  url = str(channel.get("logo", "")).strip()
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  save("GunesTV", str(channel.get("name") or channel.get("id") or "canal"), url, ROOT / "gunestv")
          except Exception as exc:
              rows.append(["GunesTV", "Catálogo Turkey", "", "https://raw.githubusercontent.com/Oktay2617/gunestv/main/channels_turkey.json",
                           "", "", "FALHA: " + str(exc)])
              print("FALHA GunesTV", exc)
          
          with (ROOT / "FONTES-ADICIONAIS.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.writer(f)
              writer.writerow(["fonte", "canal_ou_arquivo", "png_256", "url_original", "licenca", "credito", "resultado"])
              writer.writerows(rows)
          
          ok = sum(1 for row in rows if row[-1] == "OK")
          print(f"FONTES ADICIONAIS: {ok}/{len(rows)} imagens normalizadas para PNG 256x256.")
          
          PY

      - name: Criar e padronizar logos dos canais adicionados no padrão aprovado (256x256)
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageChops
          import cairosvg

          # Fontes originais para os quatro canais adicionados recentemente.
          sources = {
              "gzt.png": "https://assets.gzt.com/gzt/wwwroot/images/media-kit/gzt-logo.png",
              "bein-sports-1-turk.png": "https://i.ibb.co/3fPVPLL/Bein1.png",
              "4u-family-persian.png": "https://raw.githubusercontent.com/shayanline/iptv-iran/main/assets/logos/4UFamily.tr.png",
              "power-tv-720p.png": "https://www.tvlogo.org/turkey/power-tv-hd-tr.png",
              # Logos identificadas em fontes específicas dos canais.
              "frt-tv.png": "https://izle.livetvuk.com/uploads/tv/278-frttv.jpg",
              "izmir-time-35-tv.png": "https://izmirtime35com.teimg.com/izmirtime35-com/uploads/2023/09/logo.png",
              "syria-tv.png": "https://upload.wikimedia.org/wikipedia/commons/4/4b/Syria_TV_logo_2026.png",
              "retro-music-television.png": "https://www.tvchannellists.com/wiki/images/8/80/Retro_Music_Television.svg",
          }
          # Os 13 canais ainda sem logo original usam, temporariamente, seus SVGs
          # identificadores. Eles também são convertidos para PNG quadrado 256x256.
          placeholders = {
              "anadolu-tv.png": "anadolu-tv.svg",
              "ezgi-tv.png": "ezgi-tv.svg",
              "k-kayseri.png": "k-kayseri.svg",
              "kanal-19.png": "kanal-19.svg",
              "kanal-53.png": "kanal-53.svg",
              "kayhan-tv.png": "kayhan-tv.svg",
              "konya-ktv.png": "konya-ktv.svg",
              "tv-karadeniz.png": "tv-karadeniz.svg",
              "balkan-turk.png": "balkan-turk.svg",
              "rtg-international.png": "rtg-international.svg",
              "arzu-film.png": "arzu-film.svg",
              "madinah-tv.png": "madinah-tv.svg",
              "iq-channel.png": "iq-channel.svg",
              # Fallbacks visuais para quando uma fonte externa estiver temporariamente indisponível.
              "frt-tv.png": "frt-tv.svg",
              "izmir-time-35-tv.png": "izmir-time-35-tv.svg",
              "syria-tv.png": "syria-tv.svg",
              "retro-music-television.png": "retro-music-television.svg",
          }
          out = Path("logos-ajustadas")
          out.mkdir(exist_ok=True)

          def normalize(raw):
              if raw.lstrip().startswith(b"<") or b"<svg" in raw[:1000].lower():
                  raw = cairosvg.svg2png(bytestring=raw)
              logo = Image.open(BytesIO(raw)).convert("RGBA")
              # Remove apenas margens totalmente transparentes; preserva o desenho original.
              alpha = logo.getchannel("A")
              bbox = alpha.getbbox()
              if bbox:
                  logo = logo.crop(bbox)
              logo.thumbnail((220, 220), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 255))
              canvas.alpha_composite(logo, ((256-logo.width)//2, (256-logo.height)//2))
              return canvas.convert("RGB")

          # Gera as 13 imagens provisórias no mesmo padrão físico 256x256.
          # Quando uma fonte original for adicionada ao dicionário sources, ela
          # substituirá automaticamente o SVG provisório na próxima execução.
          for filename, svg_name in placeholders.items():
              raw = (Path("logos-placeholder") / svg_name).read_bytes()
              normalize(raw).save(out / filename, format="PNG", optimize=True)
              print(f"Imagem provisória criada: {filename} — 256x256, fundo preto")

          # Recria as logos dos canais com fontes originais.
          for filename, url in sources.items():
              try:
                  req = Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; IPTV-Logo-Bot/1.0)", "Accept": "image/png,image/svg+xml,image/*;q=0.9,*/*;q=0.8"})
                  with urlopen(req, timeout=30) as response:
                      raw = response.read()
                  normalize(raw).save(out / filename, format="PNG", optimize=True)
                  print(f"Logo original criada: {filename} — 256x256, fundo preto, sem deformação")
              except Exception as exc:
                  # Não interrompe o lote: mantém o PNG de fallback gerado acima, se disponível.
                  print(f"Aviso: fonte indisponível para {filename}: {exc}; mantendo fallback quando existente.")

          # Reenquadra e centraliza as logos existentes, preservando a proporção e sem esticar a arte (lote solicitado).
          for path in sorted(out.glob("*.png")):
              if path.name in sources:
                  continue
              logo = Image.open(path).convert("RGBA")
              # As versões antigas tinham fundo preto 2:1; identifica a área visível da arte.
              rgb = logo.convert("RGB")
              diff = ImageChops.difference(rgb, Image.new("RGB", rgb.size, (0, 0, 0)))
              bbox = diff.getbbox()
              if bbox:
                  logo = logo.crop(bbox)
              alpha_bbox = logo.getchannel("A").getbbox()
              if alpha_bbox:
                  logo = logo.crop(alpha_bbox)
              logo.thumbnail((220, 220), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 255))
              canvas.alpha_composite(logo, ((256-logo.width)//2, (256-logo.height)//2))
              canvas.convert("RGB").save(path, format="PNG", optimize=True)
              print(f"Logo reenquadrada: {path.name} — 256x256")
          PY

      - name: Atualizar todas as logos da TV principal por categoria (256x256)
        # Reprocessa também fontes alternativas verificadas para corrigir logos antigas indisponíveis.
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, unquote
          from io import BytesIO
          from PIL import Image
          import cairosvg, re

          playlist = Path("Tv.m3u")
          lines = playlist.read_text(encoding="utf-8").splitlines()
          base = "https://raw.githubusercontent.com/woodyytalo/playlist.canais.turcos/"
          branch = "github/workflows/atualizar-logos.yml/"
          root = Path("logos-ajustadas")
          ok = failed = 0
          used = {}

          def slug(value):
              value = value.lower().strip()
              value = re.sub(r"[^a-z0-9]+", "-", value).strip("-")
              return value or "canal"

          def source_bytes(url):
              parsed = urlparse(url)
              path = unquote(parsed.path).lstrip("/")
              prefix = "woodyytalo/playlist.canais.turcos/"
              if parsed.netloc == "raw.githubusercontent.com" and path.startswith(prefix):
                  local = path[len(prefix):]
                  explicit_ref = "refs/heads/" + branch
                  if local.startswith(explicit_ref):
                      local = local[len(explicit_ref):]
                  elif local.startswith(branch):
                      local = local[len(branch):]
                  candidate = Path(local)
                  if candidate.is_file():
                      return candidate.read_bytes()
              req = Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; IPTV-Logo-Bot/1.0)"})
              with urlopen(req, timeout=25) as response:
                  return response.read()

          def normalize(raw):
              if b"<svg" in raw[:4096].lower() or raw.lstrip().startswith(b"<?xml"):
                  raw = cairosvg.svg2png(bytestring=raw)
              im = Image.open(BytesIO(raw)).convert("RGBA")
              alpha = im.getchannel("A")
              bbox = alpha.getbbox()
              if bbox:
                  im = im.crop(bbox)
              im.thumbnail((220,220), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA",(256,256),(0,0,0,255))
              canvas.alpha_composite(im,((256-im.width)//2,(256-im.height)//2))
              return canvas.convert("RGB")

          for i,line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              match = re.search(r'tvg-logo="([^"]+)"', line)
              if not match:
                  failed += 1
                  continue
              url = match.group(1)
              category = re.search(r'group-title="([^"]+)"',line)
              category = category.group(1) if category else "SEM CATEGORIA"
              name = line.rsplit(",",1)[-1].strip()
              folder = slug(category)
              stem = slug(name)
              key = (folder,stem)
              used[key] = used.get(key,0)+1
              filename = stem + (f"-{used[key]}" if used[key]>1 else "") + ".png"
              target = root / folder / filename
              try:
                  raw = source_bytes(url)
                  image = normalize(raw)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  image.save(target,format="PNG",optimize=True)
                  # A branch contém barras; refs/heads/ identifica o ref completo sem ambiguidade.
                  new_url = base + "refs/heads/" + branch + "logos-ajustadas/" + folder + "/" + filename
                  lines[i] = line[:match.start(1)] + new_url + line[match.end(1):]
                  ok += 1
                  print(f"OK [{category}] {name}: {filename}")
              except Exception as exc:
                  failed += 1
                  print(f"FALHA [{category}] {name}: mantendo logo original ({exc})")

          playlist.write_text("\n".join(lines)+"\n",encoding="utf-8")
          print(f"Resultado: {ok} logos atualizadas; {failed} mantidas sem alteração por falha de origem.")
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          set -euo pipefail
          # git diff não detecta arquivos novos não rastreados; usar status para incluir os PNGs recém-gerados.
          if [[ -z "$(git status --porcelain -- Tv.m3u logos-ajustadas logos-turcas-catalogo)" ]]; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tv.m3u logos-ajustadas/ logos-turcas-catalogo/
          git commit -m "Atualizar programação, qualidade e buffer da TV principal"

          # Outros bots também gravam na mesma branch. Rebaseia sobre a versão
          # remota mais recente e tenta novamente para evitar rejeição non-fast-forward.
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Conflito ao integrar alterações remotas; tentativa ${attempt}/5."
              sleep 2
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Alterações salvas após sincronização com a branch remota."
              exit 0
            fi
            echo "Push rejeitado; nova tentativa ${attempt}/5."
            sleep 2
          done

          echo "Não foi possível publicar após cinco tentativas."
          exit 1

      - name: Disparar sincronização do EPG após atualizar a TV principal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run atualizar-epg.yml --ref "${GITHUB_REF_NAME}"
          echo "Sincronização do EPG solicitada para a versão atualizada de Tv.m3u."
