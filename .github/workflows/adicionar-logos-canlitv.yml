name: Atualizar sete logos do Canlı TV
on:
  push:
    branches:
      - 'github/workflows/atualizar-logos.yml'
    paths:
      - '.github/workflows/adicionar-logos-canlitv.yml'
      - 'scripts/adicionar_logos_canlitv.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Baixar e preparar logos
        run: python scripts/adicionar_logos_canlitv.py
      - name: Salvar logos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/015.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/046.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/057.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/064.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/095.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/130.png logos-turcas-catalogo/TODAS-LOGOS-NA-ORDEM/PNG-512-CENTRALIZADAS/171.png
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas logos."
            exit 0
          fi
          git commit -m "Atualiza sete logos com imagens do Canlı TV"
          git push
