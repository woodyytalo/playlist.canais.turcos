name: Padronizar somente logos da TV principal

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "scripts/normalizar_logos_apenas.py"
      - ".github/workflows/normalizar-logos-apenas.yml"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: normalizar-logos-tv-principal
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml

      - name: Preparar Python e bibliotecas
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Pillow e CairoSVG
        run: python -m pip install --upgrade Pillow CairoSVG

      - name: Padronizar logos sem alterar outros dados da playlist
        run: python scripts/normalizar_logos_apenas.py

      - name: Salvar somente logos e referências tvg-logo
        shell: bash
        run: |
          set -euo pipefail
          git add Tv.m3u8 assets/logos
          if git diff --cached --quiet; then
            echo "Nenhuma logo precisou de alteração."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Padronizar logos da TV principal"
          for attempt in 1 2 3 4 5; do
            git fetch origin "github/workflows/atualizar-logos.yml"
            git rebase "origin/github/workflows/atualizar-logos.yml" || { git rebase --abort || true; sleep 2; continue; }
            if git push origin "HEAD:github/workflows/atualizar-logos.yml"; then
              exit 0
            fi
            sleep 2
          done
          echo "Falha ao publicar após cinco tentativas."
          exit 1
