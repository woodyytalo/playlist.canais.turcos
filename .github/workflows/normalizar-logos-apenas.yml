name: Padronizar somente logos da TV principal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python e bibliotecas
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Pillow e CairoSVG
        run: python -m pip install --upgrade Pillow CairoSVG

      - name: Padronizar logos sem alterar outros dados da playlist
        run: python scripts/normalizar_logos_apenas.py

      - name: Salvar somente logos e referências tvg-logo
        shell: bash
        run: |
          set -euo pipefail
          git add Tv.m3u8 assets/logos
          if git diff --cached --quiet; then
            echo "Nenhuma logo precisou de alteração."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Padronizar logos da TV principal"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; sleep 2; continue; }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          echo "Falha ao publicar após cinco tentativas."
          exit 1
