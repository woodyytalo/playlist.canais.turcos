name: Corrigir logos originais da TV principal
# Tolerar apenas truncamento dos JPEGs de referência enviados no chat
# Buscar logos originais no catálogo turco quando não houver arquivo local
# Atualiza os arquivos de referência enviados pelo usuário

on:
  workflow_dispatch:
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - ".github/workflows/gerar-logos-individuais.yml"

permissions:
  contents: write

jobs:
  corrigir-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperar os arquivos originais do commit anterior à geração genérica
        run: |
          set -euo pipefail
          mkdir -p /tmp/logos-originais
          git archive b1dc984065480f5d9b1afa028ef9e98ac5fddd69 logos-ajustadas | tar -x -C /tmp/logos-originais
          git show b1dc984065480f5d9b1afa028ef9e98ac5fddd69:Tv.m3u > /tmp/Tv-original.m3u

      - name: Preparar Pillow
        run: python -m pip install --quiet pillow

      - name: Aplicar logos originais em fundo preto 512x512 e preservar quebras M3U
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          from urllib.parse import urlparse, unquote
          import re, unicodedata, urllib.request

          ROOT = Path(".")
          LEGACY = Path("/tmp/logos-originais")
          PLAYLIST = ROOT / "Tv.m3u"
          OLD_PLAYLIST = Path("/tmp/Tv-original.m3u")
          BRANCH = "github/workflows/atualizar-logos.yml"
          BASE = f"https://raw.githubusercontent.com/woodyytalo/playlist.canais.turcos/{BRANCH}/"

          def slug(value):
              value = unicodedata.normalize("NFKD", value).encode("ascii", "ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+", "-", value).strip("-") or "canal"

          def parse_entries(path):
              result = {}
              lines = path.read_text(encoding="utf-8").splitlines()
              for line in lines:
                  if not line.startswith("#EXTINF"):
                      continue
                  name = line.rsplit(",", 1)[-1].strip()
                  match = re.search(r'tvg-logo="([^"]+)"', line)
                  if match:
                      result.setdefault(name.casefold(), []).append(match.group(1))
              return result

          old_map = parse_entries(OLD_PLAYLIST)
          reference_assets = {
              "kanal d drama": ROOT / "logos-originais-referencia/kanal-d-drama.jpg",
              "ekol sports": ROOT / "logos-originais-referencia/ekol-sports.jpg",
              "dizi tv": ROOT / "logos-originais-referencia/dizi-tv.jpg",
          }
          lines = PLAYLIST.read_text(encoding="utf-8").splitlines()
          output_root = ROOT / "logos-ajustadas"
          used = set()
          converted = 0
          missing = []

          for index, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue

              name = line.rsplit(",", 1)[-1].strip()
              category_match = re.search(r'group-title="([^"]+)"', line)
              category = category_match.group(1) if category_match else "SEM CATEGORIA"
              folder = slug(category)
              stem = slug(name)

              candidates = old_map.get(name.casefold(), [])
              source = None
              for url in candidates:
                  parsed = urlparse(url)
                  relative = unquote(parsed.path.split(f"/{BRANCH}/", 1)[-1]).lstrip("/")
                  candidate = LEGACY / relative
                  if candidate.is_file():
                      source = candidate
                      break

              if source is None:
                  source = reference_assets.get(name.casefold())
                  if source is not None and not source.is_file():
                      source = None

              if source is None:
                  # Consultar o catálogo turco de logos antes de deixar o canal sem imagem.
                  remote_names = {
                      "24 tv": "24-tr.png",
                      "360 tv": "360-tr.png",
                      "a haber": "a-haber-tr.png",
                      "a para": "a-para-tr.png",
                      "a spor": "a-spor-tr.png",
                      "a2": "a2-tr.png",
                      "aksu tv": "aksu-tv-tr.png",
                      "altas tv": "altas-tv-tr.png",
                      "atv": "atv-tr.png",
                      "bengü türk": "bengu-turk-tr.png",
                      "beyaz tv": "beyaz-tv-tr.png",
                      "bloomberg ht": "bloomberg-ht-tr.png",
                      "cartoon network türkiye": "cartoon-network-tr.png",
                      "cnn türk": "cnn-turk-tr.png",
                      "çay tv": "cay-tv-tr.png",
                      "çiftçi tv": "ciftci-tv-tr.png",
                      "diyanet tv": "diyanet-tv-tr.png",
                      "diyar tv": "diyar-tv-tr.png",
                      "dream türk": "dream-turk-tr.png",
                      "edessa tv": "edessa-tv-tr.png",
                      "euro d": "euro-d-tr.png",
                      "euro star tv": "euro-star-tr.png",
                      "fashion one": "fashion-one-tv-tr.png",
                      "fb tv": "fenerbahce-tv-tr.png",
                      "flash haber tv": "flash-tv-tr.png",
                      "haber global": "haber-global-tr.png",
                      "habertürk": "haberturk-tr.png",
                      "halk tv": "halk-tv-tr.png",
                      "kanal 7 avrupa": "kanal-7-avrupa-tr.png",
                      "kanal d": "kanal-d-tr.png",
                      "kral pop": "kral-pop-tr.png",
                      "mercan tv": "mercan-tv-tr.png",
                      "minika çocuk": "minika-cocuk-tr.png",
                      "minika go": "minika-go-tr.png",
                      "now": "now-tr.png",
                      "ntv": "ntv-tr.png",
                      "power tv (720p)": "power-tv-tr.png",
                      "power dance tv": "power-tv-tr.png",
                      "power love tv": "power-tv-tr.png",
                      "powertürk tv": "powerturk-tr.png",
                      "rehber tv": "rehber-tv-tr.png",
                      "sat7 türk": "sat7-turk-tr.png",
                      "show max": "show-max-tr.png",
                      "show tv": "show-tr.png",
                      "star tv": "star-tv-tr.png",
                      "tay tv": "tay-tv-tr.png",
                      "tbmm tv": "tbmm-tv-tr.png",
                      "tele1": "tele1-tr.png",
                      "tempo tv": "tempo-tv-tr.png",
                      "teve2": "teve2-tr.png",
                      "tgrt haber": "tgrt-haber-tr.png",
                      "tivi 6": "tivi6-tr.png",
                      "tjk tv": "tjk-tv-tr.png",
                      "tv 1": "tv1-tr.png",
                      "tv 264": "tv264-tr.png",
                      "tv 4": "tv4-tr.png",
                      "tv 52": "tv52-tr.png",
                      "tv100": "tv100-tr.png",
                      "tvnet": "tvnet-tr.png",
                      "ülke tv": "ulke-tv-tr.png"
                  }
                  remote_file = remote_names.get(name.casefold(), slug(name) + "-tr.png")
                  try:
                      request = urllib.request.Request(
                          "https://www.tvlogo.org/turkey/" + remote_file,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(request, timeout=15) as response:
                          payload = response.read()
                      temp_source = Path("/tmp") / f"tvlogo-{index}.png"
                      temp_source.write_bytes(payload)
                      with Image.open(temp_source) as check:
                          check.verify()
                      source = temp_source
                  except Exception:
                      source = None

              if source is None:
                  # Não inventar marca: manter o canal sem logo até localizar o arquivo original.
                  line = re.sub(r'\s+tvg-logo="[^"]*"', "", line)
                  lines[index] = line
                  missing.append(name)
                  continue

              filename = f"{stem}.png"
              key = (folder, filename)
              number = 2
              while key in used:
                  filename = f"{stem}-{number}.png"
                  key = (folder, filename)
                  number += 1
              used.add(key)

              target = output_root / folder / filename
              target.parent.mkdir(parents=True, exist_ok=True)

              with Image.open(source) as original:
                  image = original.convert("RGBA")
                  image.thumbnail((464, 464), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 255))
                  x = (256 - image.width) // 2
                  y = (256 - image.height) // 2
                  canvas.alpha_composite(image, (x, y))
                  canvas.convert("RGB").save(target, "PNG", optimize=True)

              logo_url = BASE + f"logos-ajustadas/{folder}/{filename}"
              if re.search(r'tvg-logo="[^"]*"', line):
                  line = re.sub(r'tvg-logo="[^"]*"', f'tvg-logo="{logo_url}"', line, count=1)
              else:
                  comma = line.rfind(",")
                  line = line[:comma] + f' tvg-logo="{logo_url}"' + line[comma:]
              lines[index] = line
              converted += 1

          PLAYLIST.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"LOGOS ORIGINAIS CONVERTIDAS: {converted}")
          print(f"SEM ARQUIVO ORIGINAL LOCALIZADO: {len(missing)}")
          for name in missing:
              print(f"LOGO_PENDENTE: {name}")
          PY

      - name: Publicar logos e playlist sem alterar os links dos canais
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tv.m3u logos-ajustadas/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Restaurar logos originais em HD 512x512 na TV principal"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; sleep 2; continue; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 2
          done
          echo "Falha ao publicar após cinco tentativas."
          exit 1
