name: Vetorizar logos PNG para SVG
on:
  workflow_dispatch:
  push:
    branches:
      - github/workflows/atualizar-logos.yml
    paths:
      - .github/workflows/vetorizar-logos-svg.trigger
permissions:
  contents: read
  actions: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests vtracer
      - name: Vetorizar PNGs do catálogo
        run: python scripts/vetorizar_logos_png_para_svg.py
      - name: Publicar pacote SVG
        uses: actions/upload-artifact@v4
        with:
          name: logos-vetorizados-svg
          path: |
            artifacts/logos-vetorizados-svg/
            artifacts/logos-vetorizados-svg.zip
          if-no-files-found: error
          retention-days: 30
