name: Vetorizar logos do catálogo para SVG
on:
  workflow_dispatch:
  push:
    branches:
      - github/workflows/atualizar-logos.yml
    paths:
      - .github/workflows/vetorizar-logos-svg.trigger
permissions:
  contents: write
  actions: write
jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: github/workflows/atualizar-logos.yml
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests vtracer
      - name: Vetorizar referências de imagem do catálogo
        run: python scripts/vetorizar_logos_png_para_svg.py
      - name: Salvar SVGs no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos-turcas-catalogo/svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração SVG para salvar."
          else
            git commit -m "Adicionar logos vetorizadas em SVG"
            git push
          fi
      - name: Publicar pacote SVG
        uses: actions/upload-artifact@v4
        with:
          name: logos-vetorizados-svg
          path: logos-turcas-catalogo/svg/
          if-no-files-found: error
          retention-days: 30
