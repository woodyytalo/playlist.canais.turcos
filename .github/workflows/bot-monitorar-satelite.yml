name: Monitoramento de frequencias via satelite
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - "github/workflows/atualizar-logos.yml"
    paths:
      - "dados-satelite/ANOTACAO-CANAIS-FREQUENCIAS.md"
      - "scripts/bot_monitorar_satelite.py"
      - ".github/workflows/bot-monitorar-satelite.yml"
permissions:
  contents: write
concurrency:
  group: monitoramento-satelite
  cancel-in-progress: false
jobs:
  auditar-frequencias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar tabela de frequencias
        run: python scripts/bot_monitorar_satelite.py
      - name: Salvar relatorios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorios-satelite/monitoramento-satelite.md relatorios-satelite/monitoramento-satelite.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza relatorio de frequencias via satelite"
            git push
          else
            echo "Sem alteracoes nos relatorios."
          fi
